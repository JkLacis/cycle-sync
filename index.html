<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes phones show the page at its real size instead of zoomed out -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cycle Sync</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- The phone-shaped box that holds the whole app -->
  <div class="app">

    <!-- All screens live here. Only one is visible at a time. -->
    <main class="screens">

      <section class="screen" id="screen-onboarding" hidden>
        <h1>Welcome</h1>
        <p class="placeholder">Onboarding: coming in step 5.</p>
      </section>

      <!-- ===== Alignment (home) ===== -->
      <section class="screen screen-alignment" id="screen-alignment" hidden>

        <header class="topbar">
          <h1 class="brand">Cycle Sync</h1>
          <div class="topbar-actions">
            <button class="icon-btn" type="button" data-go="plan" aria-label="Open cycle calendar">
              <span data-icon="calendar"></span>
            </button>
            <button class="avatar" type="button" data-go="settings" aria-label="Profile and settings">
              <span data-icon="user"></span>
            </button>
          </div>
        </header>

        <div class="hero">
          <!-- Filled by renderPhaseNow() -->
          <div class="phase-now" id="phase-now"></div>
          <!-- Built by buildRing(), updated by updateRing() -->
          <div class="ring" id="ring"></div>
        </div>

        <div class="insights">
          <section class="insight insight-good" aria-labelledby="good-title">
            <button class="insight-head" type="button" data-go="plan">
              <h2 id="good-title">Good for you</h2>
              <span data-icon="chevron"></span>
            </button>
            <ul class="insight-list" id="good-list"></ul>
          </section>
          <section class="insight insight-watch" aria-labelledby="watch-title">
            <button class="insight-head" type="button" data-go="plan">
              <h2 id="watch-title">Watch-outs</h2>
              <span data-icon="chevron"></span>
            </button>
            <ul class="insight-list" id="watch-list"></ul>
          </section>
        </div>

        <section class="week-card" aria-labelledby="week-title">
          <div class="week-head">
            <h2 id="week-title">Your Calendar This Week</h2>
            <button class="link-btn" type="button" data-go="plan">
              Full calendar <span data-icon="arrow"></span>
            </button>
          </div>
          <div class="week-strip" id="week-strip" role="group" aria-label="Choose a day"></div>
          <div class="events-panel">
            <ul class="events" id="events"></ul>
            <button class="add-task" id="add-task-btn" type="button">
              <span data-icon="plus"></span> Add task
            </button>
          </div>
        </section>

      </section>

      <!-- ===== Cycle Plan ===== -->
      <section class="screen screen-plan" id="screen-plan" hidden>

        <!-- Soft leaf sprigs behind the hero (decoration only) -->
        <svg class="leaves" viewBox="0 0 390 320" aria-hidden="true">
          <defs>
            <path id="leaf-shape" d="M0 0C16-15 48-16 70 0C48 16 16 15 0 0Z"/>
            <g id="sprig">
              <path class="leaves-stem" d="M0 0C28-50 60-100 100-150"/>
              <use href="#leaf-shape" transform="translate(22 -38) rotate(-150)"/>
              <use href="#leaf-shape" transform="translate(26 -44) rotate(-25)"/>
              <use href="#leaf-shape" transform="translate(52 -82) rotate(-155)"/>
              <use href="#leaf-shape" transform="translate(56 -88) rotate(-30)"/>
              <use href="#leaf-shape" transform="translate(82 -120) rotate(-150)"/>
              <use href="#leaf-shape" transform="translate(100 -150) rotate(-65)"/>
            </g>
          </defs>
          <use href="#sprig" transform="translate(20 300) scale(0.95)"/>
          <use href="#sprig" transform="translate(372 250) scale(-1.05 1.05)"/>
        </svg>

        <header class="topbar">
          <h1 class="brand">Cycle Plan</h1>
          <div class="topbar-actions">
            <button class="icon-btn" type="button" id="plan-today-btn" aria-label="Back to this week">
              <span data-icon="calendar"></span>
            </button>
            <button class="avatar" type="button" data-go="settings" aria-label="Profile and settings">
              <span data-icon="user"></span>
            </button>
          </div>
        </header>

        <!-- Built by renderPhaseWheel() -->
        <div class="wheel" id="phase-wheel"></div>

        <!-- Built by renderPhaseCards() -->
        <div class="phase-cards" id="phase-cards"></div>

        <section class="plan-card plan-week" aria-labelledby="plan-month">
          <div class="plan-card-head">
            <h2 id="plan-month" aria-live="polite"></h2>
            <div class="week-nav">
              <button class="round-btn" type="button" data-week="-1" aria-label="Previous week"><span data-icon="back"></span></button>
              <button class="round-btn" type="button" data-week="1" aria-label="Next week"><span data-icon="chevron"></span></button>
            </div>
          </div>
          <!-- Built by renderPlanWeek() -->
          <div class="plan-days" id="plan-days"></div>
          <div class="phase-bar" id="phase-bar" aria-hidden="true"></div>
        </section>

        <!-- Logging is wired up in step 9 -->
        <section class="plan-card" aria-labelledby="track-title">
          <div class="plan-card-head">
            <h2 id="track-title">Track Today</h2>
            <button class="plus-btn" type="button" aria-label="Log today"><span data-icon="plus"></span></button>
          </div>
          <div class="track-grid">
            <button class="track track-energy" type="button"><span class="track-tile"><span data-icon="bolt"></span></span>Energy</button>
            <button class="track track-mood" type="button"><span class="track-tile"><span data-icon="smile"></span></span>Mood</button>
            <button class="track track-focus" type="button"><span class="track-tile"><span data-icon="focus"></span></span>Focus</button>
            <button class="track track-sleep" type="button"><span class="track-tile"><span data-icon="bed"></span></span>Sleep</button>
            <button class="track track-food" type="button"><span class="track-tile"><span data-icon="cutlery"></span></span>Nutrition</button>
          </div>
        </section>

        <section class="plan-card plan-focus" aria-labelledby="focus-title">
          <div class="plan-card-head">
            <h2 id="focus-title">Phase Focus</h2>
            <button class="round-btn round-btn-soft" type="button" id="focus-more" aria-label="All tips for this phase"><span data-icon="chevron"></span></button>
          </div>
          <!-- Built by renderPhaseFocus() -->
          <div class="focus-grid" id="focus-grid"></div>
        </section>

      </section>

      <section class="screen" id="screen-coach" hidden>
        <h1>AI Coach</h1>
        <p class="placeholder">Coach: coming in step 10.</p>
      </section>

      <section class="screen" id="screen-settings" hidden>
        <h1>Settings</h1>
        <p class="placeholder">Settings: coming in step 11.</p>
      </section>

      <!-- ===== Phase detail (opened from Cycle Plan) ===== -->
      <section class="screen screen-plan" id="screen-phase-detail" hidden>
        <header class="topbar">
          <button class="icon-btn" type="button" data-go="plan" aria-label="Back to Cycle Plan">
            <span data-icon="back"></span>
          </button>
        </header>
        <!-- Filled by renderPhaseDetail() -->
        <div id="phase-detail"></div>
      </section>

    </main>

    <!-- Bottom dock. data-screen says which screen each button opens. -->
    <nav class="dock" aria-label="Main">
      <button class="tab" type="button" data-screen="alignment"><span data-icon="home"></span>Alignment</button>
      <button class="tab" type="button" data-screen="plan"><span data-icon="calendar"></span>Cycle Plan</button>
      <button class="tab" type="button" data-screen="coach"><span data-icon="chat"></span>AI Coach</button>
      <button class="tab" type="button" data-screen="settings"><span data-icon="user"></span>Settings</button>
    </nav>

  </div>

  <!-- Add-task sheet -->
  <dialog class="sheet" id="task-dialog" aria-labelledby="task-dialog-title">
    <form id="task-form" novalidate>
      <div class="sheet-head">
        <h2 id="task-dialog-title">Add task</h2>
        <button class="icon-btn icon-btn-small" type="button" id="task-cancel" aria-label="Close">
          <span data-icon="close"></span>
        </button>
      </div>
      <label class="field">
        <span>Title</span>
        <input name="title" type="text" maxlength="60" required autocomplete="off">
      </label>
      <label class="field">
        <span>Type</span>
        <select name="type" id="task-type"></select>
      </label>
      <label class="field">
        <span>Date</span>
        <input name="date" type="date" required>
      </label>
      <div class="field-row">
        <label class="field">
          <span>Start</span>
          <input name="start" type="time" value="09:00" required>
        </label>
        <label class="field">
          <span>End</span>
          <input name="end" type="time" value="10:00" required>
        </label>
      </div>
      <p class="form-error" id="task-error" role="alert"></p>
      <button class="primary-btn" type="submit">Save task</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
